name: Test AWS OIDC and SSM

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  verify-oidc-and-ssm:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822824391920:role/OIDC-role
          aws-region: us-east-1

      - name: 1. Verify AWS Identity (OIDC Check)
        run: aws sts get-caller-identity

      - name: 2. Fetch Parameter from AWS SSM (Permission Check)
        run: |
          PARAM_VALUE=$(aws ssm get-parameter --region us-east-1 --name "/day02/oidc-test" --query "Parameter.Value" --output text)
          echo "Retrieved SSM Parameter: $PARAM_VALUE"
