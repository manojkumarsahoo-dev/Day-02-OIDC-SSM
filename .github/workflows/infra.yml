
name: 01 - Terraform Infra via OIDC

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-oidc:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Terraform code
      - name: Checkout Terraform code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials via OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822824391920:role/OIDC-role
          aws-region: us-east-1

      # 3. Verify AWS Authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 6. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 7. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 8. Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # 9. Verify Terraform State
      - name: Verify Terraform State
        run: |
          echo "Checking Terraform-managed resources..."
          terraform state list

      # 10. Display Terraform Outputs
      - name: Terraform Outputs
        run: terraform output
