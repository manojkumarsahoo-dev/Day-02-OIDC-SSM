
name: 02A - OIDC + Public EC2 SSH Tunnel Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-oidc-public-ec2:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Python app
        uses: actions/checkout@v4

      # 2. Authenticate AWS using OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822824391920:role/OIDC-role
          aws-region: us-east-1

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # 4. Initialize existing Terraform backend
      - name: Terraform Init
        run: terraform init -input=false

      # 5. Check existing Terraform state
      - name: Verify Terraform state
        run: |
          set -euo pipefail

          echo "Checking Terraform-managed resources..."
          terraform state list

            # 3. Retrieve existing EC2 IP addresses using AWS CLI
      - name: Get EC2 IP addresses
        run: |
          PUBLIC_EC2_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=public-ec2" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PublicIpAddress" \
            --output text)

          PRIVATE_EC2_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=private-ec2" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PrivateIpAddress" \
            --output text)

          if [ -z "$PUBLIC_EC2_IP" ] || [ -z "$PRIVATE_EC2_IP" ]; then
            echo "ERROR: Could not find both EC2 instances"
            exit 1
          fi

          echo "PUBLIC_EC2_IP=$PUBLIC_EC2_IP" >> "$GITHUB_ENV"
          echo "PRIVATE_EC2_IP=$PRIVATE_EC2_IP" >> "$GITHUB_ENV"

          echo "EC2 IP addresses retrieved successfully"

      # 7. Retrieve SSH private key from SSM
      - name: Retrieve SSH private key
        run: |
          mkdir -p ~/.ssh

          aws ssm get-parameter \
            --name "/ssh/github-bastion-key/private_key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

      # 8. Configure SSH known hosts
      - name: Configure SSH known hosts
        run: |
          ssh-keyscan -H "$PUBLIC_EC2_IP" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 9. Test public EC2 SSH connection
      - name: Test public EC2 connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$PUBLIC_EC2_IP" \
            "echo Public EC2 SSH connection successful"

      # 10. Prepare private EC2
      - name: Prepare private EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -J ubuntu@"$PUBLIC_EC2_IP" \
            ubuntu@"$PRIVATE_EC2_IP" \
            "sudo mkdir -p /opt/python-app &&
             sudo chown ubuntu:ubuntu /opt/python-app"

      # 11. Copy Python application through public EC2
      - name: Copy Python application
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyJump=ubuntu@"$PUBLIC_EC2_IP" \
            -r ./python-app/* \
            ubuntu@"$PRIVATE_EC2_IP":/opt/python-app/

      # 12. Install dependencies and restart application
      - name: Deploy Python application
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -J ubuntu@"$PUBLIC_EC2_IP" \
            ubuntu@"$PRIVATE_EC2_IP" "
              cd /opt/python-app &&
              pip3 install --break-system-packages -r requirements.txt &&
              sudo systemctl restart python-app.service &&
              sudo systemctl status python-app.service --no-pager
            "

      # 13. Cleanup SSH private key
      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
