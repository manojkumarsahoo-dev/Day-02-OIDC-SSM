
name: 02A - OIDC + Bastion SSH Tunnel Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-oidc-bastion-ssh:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Python app
        uses: actions/checkout@v4

      # 2. Authenticate AWS using OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822824391920:role/OIDC-role
          aws-region: us-east-1

      # 3. Validate GitHub secrets
      - name: Validate deployment configuration
        env:
          BASTION_IP: ${{ secrets.BASTION_PUBLIC_IP }}
          PRIVATE_IP: ${{ secrets.PRIVATE_EC2_PRIVATE_IP }}
        run: |
          if [ -z "$BASTION_IP" ]; then
            echo "ERROR: BASTION_PUBLIC_IP secret is missing"
            exit 1
          fi

          if [ -z "$PRIVATE_IP" ]; then
            echo "ERROR: PRIVATE_EC2_PRIVATE_IP secret is missing"
            exit 1
          fi

          echo "Deployment configuration verified"

      # 4. Retrieve private SSH key from SSM
      - name: Retrieve SSH private key
        run: |
          mkdir -p ~/.ssh

          aws ssm get-parameter \
            --name "/ssh/github-bastion-key/private_key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

      # 5. Configure SSH known hosts
      - name: Configure SSH known hosts
        env:
          BASTION_IP: ${{ secrets.BASTION_PUBLIC_IP }}
        run: |
          ssh-keyscan -H "$BASTION_IP" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 6. Verify Bastion SSH connection
      - name: Test Bastion connection
        env:
          BASTION_IP: ${{ secrets.BASTION_PUBLIC_IP }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$BASTION_IP" \
            "echo Bastion SSH connection successful"

      # 7. Create application directory on private EC2
      - name: Prepare private EC2
        env:
          BASTION_IP: ${{ secrets.BASTION_PUBLIC_IP }}
          PRIVATE_IP: ${{ secrets.PRIVATE_EC2_PRIVATE_IP }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -J ubuntu@"$BASTION_IP" \
            ubuntu@"$PRIVATE_IP" \
            "sudo mkdir -p /opt/python-app &&
             sudo chown ubuntu:ubuntu /opt/python-app"

      # 8. Copy Python application through Bastion
      - name: Copy Python application
        env:
          BASTION_IP: ${{ secrets.BASTION_PUBLIC_IP }}
          PRIVATE_IP: ${{ secrets.PRIVATE_EC2_PRIVATE_IP }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyJump=ubuntu@"$BASTION_IP" \
            -r ./python-app/* \
            ubuntu@"$PRIVATE_IP":/opt/python-app/

      # 9. Install dependencies and restart application
      - name: Deploy Python application
        env:
          BASTION_IP: ${{ secrets.BASTION_PUBLIC_IP }}
          PRIVATE_IP: ${{ secrets.PRIVATE_EC2_PRIVATE_IP }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -J ubuntu@"$BASTION_IP" \
            ubuntu@"$PRIVATE_IP" "
              cd /opt/python-app &&
              pip3 install --break-system-packages -r requirements.txt &&
              sudo systemctl restart python-app.service &&
              sudo systemctl status python-app.service --no-pager
            "

      # 10. Cleanup SSH private key
      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
