
name: 02A - OIDC + Bastion SSH Tunnel Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-oidc-bastion-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Python app
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822824391920:role/OIDC-role
          aws-region: us-east-1

      - name: Retrieve SSH private key from SSM
        run: |
          mkdir -p ~/.ssh

          aws ssm get-parameter \
            --name "/ssh/github-bastion-key/private_key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

      - name: Configure Bastion host
        run: |
          ssh-keyscan -H "${{ secrets.BASTION_PUBLIC_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy Python app through Bastion
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -J ubuntu@${{ secrets.BASTION_PUBLIC_IP }} \
            ubuntu@${{ secrets.PRIVATE_EC2_PRIVATE_IP }} \
            "sudo mkdir -p /opt/python-app && sudo chown ubuntu:ubuntu /opt/python-app"

          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyJump=ubuntu@${{ secrets.BASTION_PUBLIC_IP }} \
            -r ./python-app/* \
            ubuntu@${{ secrets.PRIVATE_EC2_PRIVATE_IP }}:/opt/python-app/

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -J ubuntu@${{ secrets.BASTION_PUBLIC_IP }} \
            ubuntu@${{ secrets.PRIVATE_EC2_PRIVATE_IP }} "
              cd /opt/python-app &&
              pip3 install --break-system-packages -r requirements.txt &&
              sudo systemctl restart python-app.service
            "
